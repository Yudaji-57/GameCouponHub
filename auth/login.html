    <!-- 사이드바 -->
    <div id="sidebar" class="sidebar">

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card custom-padding p-4">
                    <h2 class="text-center mb-4">로그인</h2>

                    <!-- 오류 메시지 출력 영역 -->
                    <script>
                        document.addEventListener("DOMContentLoaded", function () {
                            // localStorage에서 오류 메시지 가져오기
                            const errorMessage = localStorage.getItem("errorMessage");

                            // 오류 메시지가 있을 경우 화면에 출력
                            if (errorMessage) {
                                // 오류 메시지 출력 div 생성
                                const alertDiv = document.createElement('div');
                                alertDiv.className = 'alert alert-danger';
                                alertDiv.textContent = errorMessage;

                                // 출력 영역에 추가
                                document.body.appendChild(alertDiv);

                                // 메시지를 출력한 후 localStorage에서 삭제
                                localStorage.removeItem("errorMessage");
                            }
                        });
                    </script>

                    <form action="../auth/process_login.php" method="post">
                        <div class="mb-3">
                            <label for="userId" class="form-label">아이디</label>
                            <input type="text" id="userId" name="userId" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">비밀번호</label>
                            <input type="password" id="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">로그인</button>
                    </form>

                    <div class="text-center mt-3">
                        <a href="../auth/register.html" class="btn btn-outline-success mx-2">회원가입</a>
                        <a href="../auth/forgot_password.html" class="btn btn-outline-info mx-2">비밀번호 찾기</a>
                    </div>


                    <div class="social-login mt-4 text-center">
                        <p>소셜 로그인</p>
                        <div class="social-icons">
                            <button class="btn social-icon-btn kakao" title="카카오">
                                <i class="fas fa-comment"></i>
                            </button>
                            <button class="btn social-icon-btn naver" title="네이버">
                                <img src="https://www.navercorp.com/img/pc/service-naver-app-1.png" alt="Naver" />
                            </button>

                            <button class="btn social-icon-btn google" title="구글">
                                <i class="fab fa-google"></i>
                            </button>
                        </div>
                    </div>


                </div>
            </div>
        </div>
